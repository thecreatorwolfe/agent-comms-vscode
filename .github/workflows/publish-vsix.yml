name: Publish VSIX Artifact

on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run package:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: agent-comms-vsix
          path: "*.vsix"
